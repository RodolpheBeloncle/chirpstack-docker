# Notifications vers l'app Android (NotifyService.kt écoute l'événement `jardin_notify`)
- id: jardin_notif_sol_sec
  alias: "Jardin : sol sec"
  trigger:
    - platform: numeric_state
      entity_id: sensor.sol_humidite
      below: 20  # seuil à ajuster une fois la sonde en place
      for: "00:30:00"
  action:
    - event: jardin_notify
      event_data:
        title: "Sol sec"
        message: "Humidité du sol à {{ states('sensor.sol_humidite') }} %"

- id: jardin_notif_personne
  alias: "Jardin : personne détectée"
  trigger:
    - platform: mqtt
      topic: frigate/events
  condition:
    - "{{ trigger.payload_json.type == 'new' and trigger.payload_json.after.label == 'person' }}"
  action:
    - event: jardin_notify
      event_data:
        title: "Personne au jardin"
        message: "Détection caméra à {{ now().strftime('%H:%M') }}"
