
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
automation iotrigger: !include automations_iotrigger.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Dashboard "Jardin" éditable dans l'UI (mode storage, .storage/lovelace.dashboard_jardin sur le serveur)

# Reverse proxy Traefik (Coolify) : HA 2026 ignore la section YAML `http:` (migrée dans .storage/http).
# Sur le serveur, .storage/http contient use_x_forwarded_for: true + trusted_proxies: [10.0.1.0/24, 10.0.8.0/24] (sous data.stable).

# go2rtc externe (service docker-compose) à la place du go2rtc intégré
go2rtc:
  url: http://go2rtc:1984

# Connexion Google (composant custom cavefire/hass-openid 1.4.0, custom_components/openid)
# create_user: false → seuls les comptes HA existants (username = e-mail Google) peuvent se connecter
openid:
  client_id: !secret google_client_id
  client_secret: !secret google_client_secret
  configure_url: "https://accounts.google.com/.well-known/openid-configuration"
  validate_tls: true
  username_field: "email"
  scope: "openid profile email"
  block_login: false
  create_user: false
  use_pkce: true
  openid_text: "Se connecter avec Google"

# Dernière notification (événement iotrigger_notify) en état d'entité : les comptes non-admin ne peuvent pas
# s'abonner à un événement custom, mais peuvent suivre une entité (NotifyService.kt : subscribe_entities)
template:
  - trigger:
      - trigger: event
        event_type: iotrigger_notify
    sensor:
      - name: Notification
        unique_id: iotrigger_notification
        # horodatage en tête : chaque notification change l'état, même identique à la précédente
        state: "{{ now().timestamp() | int }}|{{ trigger.event.data.title }}|{{ trigger.event.data.message }}"

# Supervision infra (onglet Infra de l app, admin) : binary_sensor.infra_*
command_line:
  - sensor:
      name: Infra ChirpStack
      command: (curl -sf -o /dev/null -m 5 http://chirpstack:8080 && s=ON || s=OFF; echo "{\"state\":\"$s\",\"checked\":\"$(date -u +%FT%TZ)\"}")
      value_template: "{{ value_json.state | lower }}"
      json_attributes: [checked]
      scan_interval: 60
  - sensor:
      name: Infra Mosquitto
      command: (nc -z -w3 mosquitto 1883 && s=ON || s=OFF; echo "{\"state\":\"$s\",\"checked\":\"$(date -u +%FT%TZ)\"}")
      value_template: "{{ value_json.state | lower }}"
      json_attributes: [checked]
      scan_interval: 60
  - sensor:
      name: Infra go2rtc
      command: (curl -sf -o /dev/null -m 5 http://go2rtc:1984/api && s=ON || s=OFF; echo "{\"state\":\"$s\",\"checked\":\"$(date -u +%FT%TZ)\"}")
      value_template: "{{ value_json.state | lower }}"
      json_attributes: [checked]
      scan_interval: 60
  - sensor:
      name: Infra Frigate
      command: (curl -sf -o /dev/null -m 5 http://frigate:5000/api/version && s=ON || s=OFF; echo "{\"state\":\"$s\",\"checked\":\"$(date -u +%FT%TZ)\"}")
      value_template: "{{ value_json.state | lower }}"
      json_attributes: [checked]
      scan_interval: 60

mqtt:
  binary_sensor:
    # Passerelle LoRa (Pi) : stats toutes les ~30 s via le tunnel ; rien depuis 3 min = Pi/tunnel KO
    - name: Infra Passerelle LoRa
      unique_id: infra_passerelle_lora
      state_topic: eu868/gateway/a84041fdfea3a5c3/event/stats
      encoding: ""
      value_template: "ON"
      expire_after: 180
      device_class: connectivity
