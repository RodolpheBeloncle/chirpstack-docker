title: Jardin
views:
  - title: Jardin
    path: jardin
    icon: mdi:sprout
    cards:
      - type: picture-entity
        entity: camera.jardin
        name: Caméra
        camera_view: auto
      - type: entities
        title: Arrosage
        state_color: true
        entities:
          - entity: switch.vanne_jardin
            name: Vanne
            icon: mdi:valve
      - type: gauge
        entity: sensor.sol_humidite
        name: Humidité du sol
        min: 0
        max: 100
        needle: true
        severity:
          red: 0
          yellow: 20
          green: 35
      - type: entities
        title: Sol
        entities:
          - entity: sensor.sol_temperature
            name: Température
          - entity: sensor.sol_conductivite
            name: Conductivité
            icon: mdi:flash-outline
      - type: entities
        title: Sonde
        entities:
          - entity: sensor.sonde_batterie
            name: Batterie
          - entity: sensor.sonde_signal_snr
            name: Signal (SNR)
            icon: mdi:signal
  - title: Historique
    path: historique
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: Humidité du sol (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.sol_humidite
      - type: history-graph
        title: Température du sol (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.sol_temperature
      - type: history-graph
        title: Vanne (24 h)
        hours_to_show: 24
        entities:
          - entity: switch.vanne_jardin
      - type: history-graph
        title: Signal LoRa (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.sonde_signal_snr
