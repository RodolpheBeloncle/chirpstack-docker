per_listener_settings true

# Listener 1883 : reseau interne Docker uniquement (chirpstack, gateway-bridge)
# Pas expose sur l'hote (voir docker-compose.yml : mapping 1883 retire)
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd

# Listener 8883 : externe (ngrok, n8n, futurs consommateurs)
# TLS + auth obligatoires
listener 8883
allow_anonymous false
password_file /mosquitto/auth/passwd
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest stdout
