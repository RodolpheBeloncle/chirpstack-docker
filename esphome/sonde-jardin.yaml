esphome:
  name: sonde-jardin        # = compte MQTT dans MOSQUITTO_DEVICES (ACL %u)

esp32:
  board: esp32dev
  framework:
    type: esp-idf           # requis pour le TLS MQTT

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # économie d'énergie WiFi = coupures DNS/TLS

logger:
ota:
  - platform: esphome

mqtt:
  broker: mqtt.triggerstudio.dev
  port: 443
  username: sonde-jardin
  password: !secret mqtt_password
  topic_prefix: esphome/sonde-jardin
  discovery: true
  certificate_authority: !secret mqtt_ca

# D27 alimente la sonde (3,3 V) ; signal sur D32
switch:
  - platform: gpio
    pin: GPIO27
    name: "Alimentation sonde"
    restore_mode: ALWAYS_ON
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
  # Tension brute : sert à calibrer (relever à l'air et dans l'eau)
  - platform: adc
    pin: {number: GPIO32, allow_other_uses: true}
    name: "Sonde tension brute"
    id: sonde_brute
    attenuation: 12db
    update_interval: 5s
    accuracy_decimals: 3
    entity_category: diagnostic
  - platform: adc
    pin: {number: GPIO32, allow_other_uses: true}             # ADC1 seulement (32-39)
    name: "Humidité sol"
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "%"
    device_class: moisture
    filters:
      - calibrate_linear:   # mesuré 2026-10-29 : air 2,23 V, eau 0,95 V
          - 2.23 -> 0.0
          - 0.95 -> 100.0
      - clamp: {min_value: 0, max_value: 100}
