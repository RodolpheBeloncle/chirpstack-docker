esphome:
  name: sonde-jardin        # = compte MQTT dans MOSQUITTO_DEVICES (ACL %u)

esp32:
  board: esp32dev
  framework:
    type: esp-idf           # requis pour le TLS MQTT

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
ota:
  - platform: esphome

mqtt:
  broker: mqtt.triggerstudio.dev
  port: 8883
  username: sonde-jardin
  password: !secret mqtt_password
  topic_prefix: esphome/sonde-jardin
  discovery: true
  certificate_authority: !secret mqtt_ca

sensor:
  - platform: adc
    pin: GPIO34             # ADC1 seulement (32-39)
    name: "Humidité sol"
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "%"
    device_class: moisture
    filters:
      - calibrate_linear:   # à mesurer : sonde à l'air -> 0 %, dans l'eau -> 100 %
          - 2.80 -> 0.0
          - 1.20 -> 100.0
      - clamp: {min_value: 0, max_value: 100}
