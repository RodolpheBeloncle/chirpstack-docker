# Serveur Coolify : docker compose -f docker-compose.yml -f docker-compose.coolify.yml up -d
# Aucun port publié : HA passe par Traefik (coolify-proxy) en HTTPS, le reste reste interne.
# La caméra (192.168.1.16) et la future gateway LoRa sont joignables via le tunnel WireGuard wg0.
services:
  # UIs internes : uniquement sur l'IP WireGuard du serveur (VPN téléphone), jamais sur Internet
  chirpstack:
    ports: !override ["10.77.0.1:8081:8080"]  # 8080 pris par coolify-proxy
    #]
  chirpstack-gateway-bridge:
    ports: !override ["10.77.0.1:1700:1700/udp"]  # Semtech UDP, gateway Pi via wg0 uniquement
  chirpstack-gateway-bridge-basicstation:
    ports: !reset []
  chirpstack-rest-api:
    ports: !reset []
  mosquitto:
    ports: !reset []
  go2rtc:
    ports: !override ["10.77.0.1:1984:1984"]
  frigate:
    ports: !override ["10.77.0.1:8971:8971"]

  homeassistant:
    ports: !reset []
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.jardin.rule=Host(`homeassistant.triggerstudio.dev`)
      - traefik.http.routers.jardin.entrypoints=https
      - traefik.http.routers.jardin.tls.certresolver=letsencrypt
      - traefik.http.routers.jardin-http.rule=Host(`homeassistant.triggerstudio.dev`)
      - traefik.http.routers.jardin-http.entrypoints=http
      - traefik.http.routers.jardin-http.middlewares=jardin-https
      - traefik.http.middlewares.jardin-https.redirectscheme.scheme=https
      - traefik.http.services.jardin.loadbalancer.server.port=8123

  backup:
    # Conteneur outil : la tâche planifiée Coolify (1er du mois) y exécute la sauvegarde, écrasant la précédente
    image: postgres:14-alpine
    command: ["sleep", "infinity"]
    environment:
      - PGPASSWORD=chirpstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U chirpstack || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - /opt/jardin/configuration:/config:ro
      - mosquittodata:/mosquitto:ro
      - /opt/backups:/backups

networks:
  coolify:
    external: true
