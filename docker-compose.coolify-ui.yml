# Ressource Coolify "Docker Compose Empty" (coller ce fichier dans l'UI Coolify).
# Généré depuis docker-compose.yml + docker-compose.coolify.yml (docker compose config --no-interpolate).
# Données en place : bind mounts absolus /opt/jardin/configuration/* + volumes jardin_* existants (external).
# Secrets : variables ${...} à renseigner dans l'onglet Environment Variables de Coolify (valeurs de /opt/jardin/.env).
networks:
  default: {}
services:
  chirpstack:
    command: -c /etc/chirpstack
    depends_on:
      mosquitto:
        condition: service_started
        required: true
      postgres:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - MQTT_USERNAME=chirpstack
      - MQTT_PASSWORD=${MOSQUITTO_CHIRPSTACK_PASSWORD}
    image: chirpstack/chirpstack:4
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    ports:
      - host_ip: 10.77.0.1
        mode: ingress
        protocol: tcp
        published: "8081"
        target: 8080
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/chirpstack
        target: /etc/chirpstack
        type: bind
  chirpstack-gateway-bridge:
    depends_on:
      mosquitto:
        condition: service_started
        required: true
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=chirpstack
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${MOSQUITTO_CHIRPSTACK_PASSWORD}
      - METRICS__PROMETHEUS__ENDPOINT_ENABLED=true
      - METRICS__PROMETHEUS__BIND=0.0.0.0:9100
    image: chirpstack/chirpstack-gateway-bridge:4
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    ports:
      - host_ip: 10.77.0.1
        mode: ingress
        protocol: udp
        published: "1700"
        target: 1700
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/chirpstack-gateway-bridge
        target: /etc/chirpstack-gateway-bridge
        type: bind
  chirpstack-gateway-bridge-basicstation:
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-eu868.toml
    depends_on:
      mosquitto:
        condition: service_started
        required: true
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=chirpstack
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${MOSQUITTO_CHIRPSTACK_PASSWORD}
    image: chirpstack/chirpstack-gateway-bridge:4
    healthcheck:
      test: ["CMD-SHELL","nc -z localhost 3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/chirpstack-gateway-bridge
        target: /etc/chirpstack-gateway-bridge
        type: bind
  chirpstack-rest-api:
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    depends_on:
      chirpstack:
        condition: service_started
        required: true
    image: chirpstack/chirpstack-rest-api:4
    healthcheck:
      test: ["CMD-SHELL","nc -z localhost 8090 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    restart: unless-stopped
  frigate:
    depends_on:
      go2rtc:
        condition: service_started
        required: true
      mosquitto:
        condition: service_started
        required: true
    environment:
      - TZ=Europe/Paris
      - FRIGATE_MQTT_PASSWORD=${MOSQUITTO_FRIGATE_PASSWORD}
    image: ghcr.io/blakeblackshear/frigate:stable
    networks:
      default: null
    ports:
      - host_ip: 10.77.0.1
        mode: ingress
        protocol: tcp
        published: "8971"
        target: 8971
    restart: unless-stopped
    shm_size: 256mb
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/frigate
        target: /config
        type: bind
      - source: frigatemedia
        target: /media/frigate
        type: volume
        volume: {}
      - target: /tmp/cache
        tmpfs:
          size: 1000000000
        type: tmpfs
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://localhost:1984/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    ports:
      - host_ip: 10.77.0.1
        mode: ingress
        protocol: tcp
        published: "1984"
        target: 1984
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/go2rtc
        target: /config
        type: bind
  homeassistant:
    depends_on:
      mosquitto:
        condition: service_started
        required: true
    environment:
      - TZ=Europe/Paris
    image: ghcr.io/home-assistant/home-assistant:stable
    labels:
      # HSTS : ajouté au routeur HTTPS généré par Coolify (nom = https-0-<uuid>-homeassistant-bdda)
      - traefik.http.middlewares.ha-hsts.headers.stsSeconds=31536000
      - traefik.http.routers.https-0-8q3bqxofsb5unbrb3s7nm2ed-homeassistant-bdda.middlewares=gzip-sse,ha-hsts
    healthcheck:
      test: ["CMD-SHELL","curl -fsS -o /dev/null http://localhost:8123/manifest.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/homeassistant
        target: /config
        type: bind
  mosquitto:
    command:
      - -c
      - |
        rm -f /mosquitto/auth/passwd
        mosquitto_passwd -b -c /mosquitto/auth/passwd chirpstack "$$MOSQUITTO_CHIRPSTACK_PASSWORD"
        mosquitto_passwd -b /mosquitto/auth/passwd homeassistant "$$MOSQUITTO_HA_PASSWORD"
        mosquitto_passwd -b /mosquitto/auth/passwd frigate "$$MOSQUITTO_FRIGATE_PASSWORD"
        mosquitto_passwd -b /mosquitto/auth/passwd esphome "$$MOSQUITTO_ESPHOME_PASSWORD"
        # un compte par ESP32 : MOSQUITTO_DEVICES="nom1:mdp1 nom2:mdp2" (nom = name ESPHome)
        for d in $$MOSQUITTO_DEVICES; do mosquitto_passwd -b /mosquitto/auth/passwd "$${d%%:*}" "$${d#*:}"; done
        chown -R mosquitto:mosquitto /mosquitto/auth /mosquitto/data
        chmod 600 /mosquitto/auth/passwd
        exec su -s /bin/sh mosquitto -c "/usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    entrypoint: /bin/sh
    environment:
      - MOSQUITTO_CHIRPSTACK_PASSWORD=${MOSQUITTO_CHIRPSTACK_PASSWORD}
      - MOSQUITTO_HA_PASSWORD=${MOSQUITTO_HA_PASSWORD}
      - MOSQUITTO_FRIGATE_PASSWORD=${MOSQUITTO_FRIGATE_PASSWORD}
      - MOSQUITTO_ESPHOME_PASSWORD=${MOSQUITTO_ESPHOME_PASSWORD}
      - MOSQUITTO_DEVICES=${MOSQUITTO_DEVICES:-}
    image: eclipse-mosquitto:2
    healthcheck:
      test: ["CMD-SHELL","nc -z localhost 1883 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    # MQTT TLS aussi sur 443 : Traefik route par SNI mqtt.triggerstudio.dev sans déchiffrer (passthrough)
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.mqtt-tls.entrypoints=https
      - traefik.tcp.routers.mqtt-tls.rule=HostSNI(`mqtt.triggerstudio.dev`)
      - traefik.tcp.routers.mqtt-tls.tls.passthrough=true
      - traefik.tcp.services.mqtt-tls.loadbalancer.server.port=8883
    restart: unless-stopped
    user: root
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/mosquitto/config
        target: /mosquitto/config
        type: bind
      - source: mosquittoauth
        target: /mosquitto/auth
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/mosquitto/certs
        target: /mosquitto/certs
        type: bind
      - source: mosquittodata
        target: /mosquitto/data
        type: volume
        volume: {}
  backup:
    # Conteneur outil : la tâche planifiée Coolify (1er du mois) y exécute la sauvegarde, écrasant la précédente
    image: postgres:14-alpine
    command: ["sleep", "infinity"]
    environment:
      - PGPASSWORD=chirpstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U chirpstack || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - /opt/jardin/configuration:/config:ro
      - mosquittodata:/mosquitto:ro
      - /opt/backups:/backups
  postgres:
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack
    image: postgres:14-alpine
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U chirpstack || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /opt/jardin/configuration/postgresql/initdb
        target: /docker-entrypoint-initdb.d
        type: bind
      - source: postgresqldata
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  redis:
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL","redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: redisdata
        target: /data
        type: volume
        volume: {}
volumes:
  frigatemedia:
    name: jardin_frigatemedia
    external: true
  mosquittoauth:
    name: jardin_mosquittoauth
    external: true
  mosquittodata:
    name: jardin_mosquittodata
    external: true
  postgresqldata:
    name: jardin_postgresqldata
    external: true
  redisdata:
    name: jardin_redisdata
    external: true
